<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Predictor</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="sidebar">

    <h1>LeadPredictor</h1>

    <label>Total Revenue</label>
    <input type="number" id="revenue" value="10000">

    <label>Average Order Value</label>
    <input type="number" id="orderValue" value="1000">

  </div>

  <div class="main-content">

    <div class="cards">

      <div class="card">
        <h2>Prospects</h2>
        <p id="prospects">0</p>
      </div>

      <div class="card">
        <h2>Leads</h2>
        <p id="leads">0</p>
      </div>

      <div class="card">
        <h2>Customers</h2>
        <p id="customers">0</p>
      </div>

    </div>

    <div class="sliders">

      <label>Lead Response Rate</label>
      <input type="range" id="leadRate" min="1" max="100" value="40">

      <label>Prospect Response Rate</label>
      <input type="range" id="prospectRate" min="1" max="100" value="20">

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
